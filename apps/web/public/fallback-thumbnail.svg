<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a3e635;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#84cc16;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Geometric pattern -->
  <g opacity="0.1">
    <circle cx="200" cy="200" r="150" fill="none" stroke="#a3e635" stroke-width="2"/>
    <circle cx="600" cy="600" r="180" fill="none" stroke="#a3e635" stroke-width="2"/>
    <line x1="100" y1="400" x2="700" y2="400" stroke="#a3e635" stroke-width="1"/>
    <line x1="400" y1="100" x2="400" y2="700" stroke="#a3e635" stroke-width="1"/>
  </g>
  
  <!-- Icon -->
  <g transform="translate(300, 250)">
    <rect x="0" y="40" width="200" height="280" rx="8" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="100" cy="120" r="30" fill="url(#accent)"/>
    <path d="M 40 200 Q 100 160 160 200" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <rect x="60" y="250" width="80" height="50" rx="25" fill="url(#accent)" opacity="0.6"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="620" font-family="sans-serif" font-size="24" fill="#666" text-anchor="middle">
    thecueRoom
  </text>
</svg>
